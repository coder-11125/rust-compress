[workspace]
resolver = "3"
members = ["core", "deflate", "png", "jpeg", "webp", "gif", "avif", "cli", "testutil"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/coder-11125/rust-compress"
authors = []

[workspace.dependencies]
rc-core = { path = "core" }
rc-deflate = { path = "deflate" }
rc-png = { path = "png" }
rc-jpeg = { path = "jpeg" }
rc-webp = { path = "webp" }
rc-gif = { path = "gif" }
rc-avif = { path = "avif" }
rc-testutil = { path = "testutil" }
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
assert_cmd = "2.2.2"
image = "0.25.10"
tempfile = "3.27.0"

[workspace.lints.clippy]
# chunks_exact is clearer than as_chunks where the chunk size is a runtime channel count.
chunks_exact_to_as_chunks = "allow"
# Index loops are intentional in the numeric kernels (they vectorize well and mirror the reference algorithms).
needless_range_loop = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
