[package]
name = "rust-compress"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"

[dev-dependencies]
assert_cmd = "2.2.2"
image = "0.25.10"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
# chunks_exact is clearer than as_chunks where the chunk size is a runtime channel count.
chunks_exact_to_as_chunks = "allow"
# Index loops are intentional in the numeric kernels (they vectorize well and mirror the reference algorithms).
needless_range_loop = "allow"
