[package]
name = "rust-compress"
version = "0.1.0"
edition = "2024"
description = "Fast PNG and JPEG image compressor with a from-scratch engine (DEFLATE, PNG, JPEG, quantization) and no codec dependencies"
license = "MIT"
repository = "https://github.com/coder-11125/rust-compress"
readme = "README.md"
keywords = ["png", "jpeg", "image", "compression", "optimizer"]
categories = ["command-line-utilities", "multimedia::images", "compression"]
exclude = ["/.github", "/.omc"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"

[dev-dependencies]
assert_cmd = "2.2.2"
image = "0.25.10"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
# chunks_exact is clearer than as_chunks where the chunk size is a runtime channel count.
chunks_exact_to_as_chunks = "allow"
# Index loops are intentional in the numeric kernels (they vectorize well and mirror the reference algorithms).
needless_range_loop = "allow"
