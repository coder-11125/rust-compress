name: Release

# Push a tag such as v0.1.0 to build binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="rust-compress-${GITHUB_REF_NAME}-${{ matrix.target }}"
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" > "$1.sha256"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1" > "$1.sha256"
            else
              openssl dgst -sha256 -r "$1" > "$1.sha256"
            fi
          }
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/rc.exe" "$name/"
            7z a "$name.zip" "$name"
            hash_file "$name.zip"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
            echo "CHECKSUM=$name.zip.sha256" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/rc" "$name/"
            tar czf "$name.tar.gz" "$name"
            hash_file "$name.tar.gz"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
            echo "CHECKSUM=$name.tar.gz.sha256" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          generate_release_notes: true
