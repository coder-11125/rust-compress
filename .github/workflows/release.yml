name: Release

# Push a tag such as v0.1.0 to build binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          # Cross-compile the Intel build on an arm64 runner: macos-13 is the last hosted Intel
          # image and jobs there can queue for a long time. Pure-Rust means no C toolchain is needed.
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            cat <<'HEADER'
          Fast PNG, JPEG, WebP and AVIF compression with a from-scratch engine and no codec dependencies.

          ## Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/coder-11125/rust-compress/main/install.sh | sh
          ```

          Detects Linux or macOS on x86_64/arm64 and installs the `rc` binary to `/usr/local/bin`, or
          `~/.local/bin` when that is not writable. Pin a release with `RC_VERSION=v0.1.0` or choose a
          directory with `RC_INSTALL_DIR`. Windows users can download the `.zip` asset below.

          ## Changes
          HEADER
            awk -v ver="$version" '
              $0 ~ "^## " ver "([ -]|$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            cat <<'FOOTER'

          ## Verifying downloads

          Every archive has a `.sha256` sidecar:

          ```sh
          shasum -a 256 -c rust-compress-<tag>-<target>.tar.gz.sha256   # macOS
          sha256sum -c rust-compress-<tag>-<target>.tar.gz.sha256      # Linux
          ```
          FOOTER
          } > release-notes.md
      - name: Package
        shell: bash
        run: |
          name="rust-compress-${GITHUB_REF_NAME}-${{ matrix.target }}"
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" > "$1.sha256"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1" > "$1.sha256"
            else
              openssl dgst -sha256 -r "$1" > "$1.sha256"
            fi
          }
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/rc.exe" "$name/"
            7z a "$name.zip" "$name"
            hash_file "$name.zip"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
            echo "CHECKSUM=$name.zip.sha256" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/rc" "$name/"
            tar czf "$name.tar.gz" "$name"
            hash_file "$name.tar.gz"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
            echo "CHECKSUM=$name.tar.gz.sha256" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
